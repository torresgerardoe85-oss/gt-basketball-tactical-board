<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><title>GT Basketball · Pizarra Táctica</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1726;color:#f6f7fa;font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}button,select,input{font:inherit}button{background:#1b2a3d;border:1px solid #33435a;border-radius:10px;color:inherit;padding:10px 12px;cursor:pointer;touch-action:manipulation}button.active{background:#2769d6;border-color:#6da4ff}button:focus-visible{outline:2px solid #ffd27b}button:disabled{opacity:.4}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:#121f30;border-bottom:1px solid #28374b}.brand{font-weight:850;letter-spacing:.6px;font-size:17px}.brand small{display:block;color:#8da6c5;font-size:10px;letter-spacing:1.5px}.topcontrols,.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.workspace{display:grid;grid-template-columns:1fr 240px;gap:12px;padding:12px;height:calc(100dvh - 67px)}.boardwrap{min-height:0;border:1px solid #38475a;border-radius:16px;overflow:hidden;background:#dcb483;position:relative;display:flex;align-items:center;justify-content:center}.board{width:100%;height:100%;display:block;touch-action:none;user-select:none}.sidebar{background:#142238;border:1px solid #30435b;border-radius:14px;padding:13px;overflow:auto}.sidebar h2{font-size:13px;text-transform:uppercase;color:#9fb3ce;letter-spacing:1px;margin:5px 0 12px}.section{margin-bottom:16px;border-bottom:1px solid #2d3d51;padding-bottom:12px}.section:last-child{border:0}.tools button{padding:9px}.colors{display:flex;gap:10px;margin-top:10px}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0;flex:none}.swatch.active{outline:2px solid white;outline-offset:2px;border-color:#e7c98e}.row{display:flex;align-items:center;gap:8px;margin:9px 0;flex-wrap:wrap}.row label{color:#becce0}.row input[type=range]{width:105px}.hint{font-size:12px;color:#adbed2;line-height:1.45}.status{font-size:12px;color:#88e0b9;margin-top:10px}.full{width:100%}.small{font-size:12px}.drawing{pointer-events:none}.piece{cursor:grab;touch-action:none}.piece text{fill:white;font-size:17px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.piece circle{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 3px 3px #0006)}.ball circle{fill:#e88732}.line{fill:none;stroke:#faf7ef;stroke-width:2.3;vector-effect:non-scaling-stroke}.mark{fill:none;stroke-linecap:round;stroke-linejoin:round}.grain{stroke:#9f723f;stroke-width:.6;opacity:.23}body.compact .workspace{grid-template-columns:1fr 185px}body.compact .sidebar{padding:9px}body.compact .brand{font-size:13px}@media(max-width:900px){.workspace{grid-template-columns:1fr 175px}.sidebar{padding:9px}header{padding:7px;gap:7px}.brand{font-size:13px}}@media(max-width:680px){header{flex-wrap:wrap}.workspace{height:calc(100dvh - 103px);grid-template-columns:1fr 132px;gap:5px;padding:5px}.tools{gap:4px}.tools button{padding:7px;font-size:12px}.sidebar h2{font-size:11px}.row input[type=range]{width:75px}.swatch{width:25px;height:25px}.colors{gap:5px}}@media(max-height:540px){header{padding:4px 10px}.workspace{height:calc(100dvh - 48px)}.section{margin-bottom:8px;padding-bottom:7px}.sidebar h2{margin:2px 0 5px}}
</style></head><body><header><div class="brand">GT BASKETBALL <small>TACTICAL BOARD</small></div><div class="topcontrols"><button id="mode" class="active">● Con fichas</button><button id="view">Media cancha</button><button id="fullscreen">⛶ Pantalla completa</button></div></header>
<main class="workspace"><div class="boardwrap"><svg class="board" id="court" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" aria-label="Pizarra de baloncesto interactiva"><defs><pattern id="wood" width="1000" height="56" patternUnits="userSpaceOnUse"><rect width="1000" height="56" fill="#e7c698"/><path d="M0 55 H1000" stroke="#c59864" stroke-width="2" opacity=".26"/><path d="M0 12 H1000 M0 29 H1000" stroke="#c59864" opacity=".11"/></pattern></defs><rect width="1000" height="560" fill="url(#wood)"/><g id="courtlines" class="line"></g><g id="drawings"></g><g id="draft"></g><g id="pieces"></g></svg></div>
<aside class="sidebar"><div class="section"><h2>Herramientas</h2><div class="tools"><button id="pen" class="active">✎ Marcador</button><button id="eraser">⌫ Borrador</button></div><div class="colors" id="palette"></div><div class="row"><label for="width">Grosor</label><input id="width" type="range" min="2" max="12" value="4"></div><div class="row"><button id="drawlock">🔓 Dibujo activo</button></div><p class="hint">Toca una ficha para moverla. Dibuja directamente sobre cualquier espacio libre de la cancha.</p></div>
<div class="section"><h2>Acciones</h2><div class="tools"><button id="undo">↶</button><button id="redo">↷</button><button id="clear">Borrar trazos</button><button id="reset">Reiniciar fichas</button></div></div>
<div class="section"><h2>Jugadas</h2><div class="row"><button id="save" class="full">Guardar jugada</button><button id="load" class="full">Abrir jugada</button></div><div id="status" class="status" role="status">Lista para dirigir</div></div><p class="hint">Se conserva automáticamente la pizarra en este dispositivo. Sin cuentas ni datos compartidos.</p></aside></main>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',court=document.getElementById('court'),lines=document.getElementById('courtlines'),drawings=document.getElementById('drawings'),draft=document.getElementById('draft'),piecesEl=document.getElementById('pieces'),status=document.getElementById('status');
const colors=['#161a23','#165bd8','#d52b3e','#138451','#783cb8'];let color=colors[0],width=4,tool='pen',locked=false,mode=true,half=false,strokes=[],pieces=[],selected=null,active=null,history=[],future=[];
const $=id=>document.getElementById(id);const el=(tag,attrs={},parent)=>{let n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(parent)parent.appendChild(n);return n};
function setup(){pieces=[];for(let i=0;i<5;i++){pieces.push({id:'o'+i,n:i+1,x:[260,155,365,390,170][i],y:[380,370,370,230,230][i],team:'o'});pieces.push({id:'d'+i,n:i+1,x:[260,155,365,390,170][i],y:[300,310,310,160,160][i],team:'d'})}pieces.push({id:'ball',n:'',x:287,y:377,team:'ball'})}
function snapshot(){return JSON.stringify({strokes,pieces,mode,half,locked})}function checkpoint(){history.push(snapshot());if(history.length>80)history.shift();future=[]}function restore(s){const v=JSON.parse(s);strokes=v.strokes;pieces=v.pieces;mode=v.mode;half=v.half;locked=v.locked;sync();persist()}
function persist(){try{localStorage.setItem('gt-board-autosave',snapshot())}catch(e){notify('No se pudo guardar localmente')}}function notify(t){status.textContent=t}
function courtArt(){lines.replaceChildren();const path=d=>el('path',{d},lines);path('M30 30H970V530H30Z');if(!half){path('M500 30V530');el('circle',{cx:500,cy:280,r:66},lines);for(let side of [0,1]){const flip=side?'translate(1000,0) scale(-1,1)':'';const g=el('g',{transform:flip},lines);el('rect',{x:30,y:183,width:175,height:194,fill:'#c78e55','fill-opacity':'.24'},g);el('path',{d:'M30 183H205V377H30 M92 280H205'},g);el('circle',{cx:92,cy:280,r:13},g);el('path',{d:'M30 76H83 A232 232 0 0 1 83 484H30'},g);el('path',{d:'M205 214 A67 67 0 0 1 205 346', 'stroke-dasharray':'9 9'},g)}}else{path('M500 30V530');el('circle',{cx:500,cy:280,r:66},lines);el('rect',{x:30,y:183,width:175,height:194,fill:'#c78e55','fill-opacity':'.24'},lines);path('M30 183H205V377H30 M92 280H205');el('circle',{cx:92,cy:280,r:13},lines);path('M30 76H83 A232 232 0 0 1 83 484H30');path('M205 214 A67 67 0 0 1 205 346')}} 
function draw(){drawings.replaceChildren();for(const s of strokes){let p=el('polyline',{points:s.points.map(p=>p.join(',')).join(' '),stroke:s.color,'stroke-width':s.width,class:'mark'},drawings)}}
function renderPieces(){piecesEl.replaceChildren();if(!mode)return;for(const p of pieces){let g=el('g',{class:'piece'+(p.team==='ball'?' ball':''),'data-id':p.id,transform:'translate('+p.x+','+p.y+')'},piecesEl);el('circle',{r:p.team==='ball'?13:22,fill:p.team==='o'?'#1764d6':p.team==='d'?'#d72b3d':'#e88732'},g);if(p.team==='ball'){el('path',{d:'M-11 0H11 M0 -12Q9 0 0 12 M0 -12Q-9 0 0 12',stroke:'#57341b','stroke-width':1.8,fill:'none'},g)}else{let t=el('text',{x:0,y:1},g);t.textContent=p.n}}}
function sync(){courtArt();draw();renderPieces();$('mode').textContent=mode?'● Con fichas':'✎ Solo marcador';$('mode').classList.toggle('active',mode);$('view').textContent=half?'Cancha completa':'Media cancha';$('drawlock').textContent=locked?'🔒 Dibujo bloqueado':'🔓 Dibujo activo';$('drawlock').classList.toggle('active',locked)}
function pos(e){const point=court.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const m=court.getScreenCTM();if(!m)return [500,280];const q=point.matrixTransform(m.inverse());return [Math.max(30,Math.min(970,q.x)),Math.max(30,Math.min(530,q.y))]}
function nearStroke(x,y,s){for(const p of s.points){if(Math.hypot(p[0]-x,p[1]-y)<18)return true}return false}
court.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();const g=e.target.closest('.piece');const [x,y]=pos(e);if(g&&mode){checkpoint();selected=pieces.find(p=>p.id===g.getAttribute('data-id'));active={type:'piece'};court.setPointerCapture(e.pointerId);return}if(locked)return;if(tool==='eraser'){let idx=strokes.findLastIndex(s=>nearStroke(x,y,s));if(idx>=0){checkpoint();strokes.splice(idx,1);draw();persist()}return}checkpoint();active={type:'draw',points:[[x,y]],color,width};court.setPointerCapture(e.pointerId)});
court.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();let [x,y]=pos(e);if(active.type==='piece'&&selected){selected.x=x;selected.y=y;renderPieces()}else if(active.type==='draw'){active.points.push([x,y]);draft.replaceChildren();el('polyline',{points:active.points.map(p=>p.join(',')).join(' '),stroke:active.color,'stroke-width':active.width,class:'mark'},draft)}});
function finish(e){if(!active)return;e.preventDefault();if(active.type==='draw'){strokes.push({points:active.points,color:active.color,width:active.width});draft.replaceChildren();draw()}active=null;selected=null;persist()}
court.addEventListener('pointerup',finish);court.addEventListener('pointercancel',finish);window.addEventListener('blur',()=>{if(active){active=null;selected=null;draft.replaceChildren();persist()}});
$('mode').onclick=()=>{checkpoint();mode=!mode;sync();persist()};$('view').onclick=()=>{checkpoint();half=!half;sync();persist()};$('drawlock').onclick=()=>{checkpoint();locked=!locked;sync();persist()};$('pen').onclick=()=>{tool='pen';$('pen').classList.add('active');$('eraser').classList.remove('active')};$('eraser').onclick=()=>{tool='eraser';$('eraser').classList.add('active');$('pen').classList.remove('active')};
$('width').oninput=e=>width=Number(e.target.value);$('undo').onclick=()=>{if(history.length){future.push(snapshot());restore(history.pop())}};$('redo').onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop())}};
$('clear').onclick=()=>{checkpoint();strokes=[];draw();persist()};$('reset').onclick=()=>{checkpoint();setup();renderPieces();persist()};
$('palette').replaceChildren();colors.forEach((c,i)=>{let b=document.createElement('button');b.className='swatch'+(!i?' active':'');b.style.background=c;b.setAttribute('aria-label',['Negro','Azul','Rojo','Verde','Violeta'][i]);b.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool='pen';$('pen').classList.add('active');$('eraser').classList.remove('active')};$('palette').appendChild(b)});
$('save').onclick=()=>{let name=prompt('Nombre de la jugada');if(!name||!name.trim())return;try{let saved=JSON.parse(localStorage.getItem('gt-board-plays')||'{}');saved[name.trim()]=snapshot();localStorage.setItem('gt-board-plays',JSON.stringify(saved));notify('Jugada guardada: '+name.trim())}catch(e){notify('Error al guardar la jugada')}};
$('load').onclick=()=>{let saved=JSON.parse(localStorage.getItem('gt-board-plays')||'{}'),names=Object.keys(saved);if(!names.length){notify('Aún no hay jugadas guardadas');return}let name=prompt('Escribe el nombre de una jugada para abrir:\n'+names.join('\n'),names[0]);if(name&&saved[name]){checkpoint();restore(saved[name]);notify('Jugada abierta: '+name)}};
$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>notify('Usa Añadir a pantalla de inicio en Safari'))};
setup();try{const saved=localStorage.getItem('gt-board-autosave');if(saved){const v=JSON.parse(saved);strokes=v.strokes||[];pieces=v.pieces||pieces;mode=v.mode!==false;half=!!v.half;locked=!!v.locked}}catch(e){}sync();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
